<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="snowz.ai — AI et outils dev en français."
    />
    <title>snowz.ai</title>
    <link rel="canonical" href="https://lucasnp.dev/snowz" />
    <link
      rel="icon"
      type="image/png"
      href="/assets/icons/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
    <link rel="shortcut icon" href="/assets/icons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icons/apple-touch-icon.png"
    />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem 1.5rem;
      }
      main {
        width: 100%;
        max-width: 440px;
        position: relative;
      }
      header {
        flex-direction: column;
        align-items: center;
        margin-bottom: 1.25rem;
        gap: 1rem;
      }
      .avatar {
        width: 88px;
        height: 88px;
        filter: none;
      }
      .header-actions {
        position: absolute;
        top: 0;
        right: 0;
      }
      .content {
        text-align: center;
        margin-bottom: 1.75rem;
      }
      .content > p {
        margin-bottom: 0.5rem;
        font-size: 15px;
      }
      .content > p strong {
        display: block;
        font-size: 17px;
        margin-bottom: 0.35rem;
      }
      .content > p .tagline {
        color: var(--text-muted);
        font-size: 13px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 0.5rem;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4ade80;
        box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5); }
        70% { box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
        100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
      }
      .section-label {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: lowercase;
        letter-spacing: 0.08em;
        margin: 0 0 0.75rem;
        opacity: 0.6;
        text-align: left;
      }
      .content ul {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .content li.project {
        padding: 0.85rem 1rem;
        display: flex;
        align-items: center;
        gap: 0.85rem;
        margin: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.02);
        transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
      }
      .content li.project:hover {
        border-color: var(--text-muted);
        background: rgba(255, 255, 255, 0.04);
        transform: translateY(-1px);
      }
      body:not(.dark) .content li.project {
        background: rgba(0, 0, 0, 0.02);
      }
      body:not(.dark) .content li.project:hover {
        background: rgba(0, 0, 0, 0.04);
      }
      .content li.project::before { content: none; }
      .content li.project a {
        text-decoration: none;
        border: none;
      }
      .content li.project a::after {
        content: "";
        position: absolute;
        inset: 0;
      }
      .content li.project { position: relative; }
      .project-icon {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
      }
      .project-body {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        text-align: left;
        min-width: 0;
      }
      .project-name {
        font-weight: 600;
        font-size: 14px;
      }
      .project-desc {
        font-size: 12px;
        color: var(--text-muted);
      }
      .project-meta {
        margin-left: auto;
        font-size: 10px;
        color: var(--text-muted);
        opacity: 0.7;
        letter-spacing: 0.05em;
        padding-left: 0.5rem;
        flex-shrink: 0;
      }
      footer {
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        border-top: 1px solid var(--border);
        padding-top: 1.25rem;
      }
      .links {
        gap: 1.25rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .copyright { font-size: 11px; opacity: 0.6; }
      @media (max-width: 480px) {
        body { padding: 1.5rem 1rem; align-items: flex-start; }
        .avatar { width: 72px; height: 72px; }
        .content li.project { padding: 0.75rem 0.85rem; }
        .project-icon { width: 34px; height: 34px; }
      }
    </style>

    <meta property="og:title" content="snowz.ai" />
    <meta property="og:description" content="AI et outils dev en français." />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://lucasnp.dev/snowz/snowz.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <main>
      <header>
        <img src="/snowz/snowz.png" alt="snowz.ai" class="avatar" />
        <div class="header-actions">
          <button
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Toggle theme"
          >
            <span class="theme-icon">○</span>
          </button>
        </div>
      </header>

      <div class="content">
        <p>
          <strong>snowz.ai</strong>
          <span class="tagline">Open Source Engineer · AI workflows and tools</span>
        </p>
        <div class="status">
          <span class="status-dot"></span>
          <span>currently building vikusha</span>
        </div>

        <div style="margin-top: 2rem;">
          <div class="section-label">// projects</div>
          <ul>
            <li class="project">
              <img src="/snowz/vikusha.png" class="project-icon" alt="" />
              <div class="project-body">
                <span class="project-name"><a href="https://github.com/snowztech/vikusha">vikusha</a></span>
                <span class="project-desc">framework pour assistants</span>
              </div>
              <span class="project-meta">go · wip</span>
            </li>
            <li class="project">
              <img src="/snowz/nevinho.png" class="project-icon" alt="" />
              <div class="project-body">
                <span class="project-name"><a href="https://github.com/lucasnevespereira/nevinho">nevinho</a></span>
                <span class="project-desc">mon assistant perso</span>
              </div>
              <span class="project-meta">go</span>
            </li>
          </ul>
        </div>
      </div>

      <footer>
        <div class="links">
          <a
            href="https://www.tiktok.com/@snowz.ai"
            target="_blank"
            rel="noopener noreferrer"
            >tiktok</a
          >
          <a
            href="https://www.youtube.com/c/lucaasnp"
            target="_blank"
            rel="noopener noreferrer"
            >youtube</a
          >
          <a
            href="https://dev.to/lucasnevespereira"
            target="_blank"
            rel="noopener noreferrer"
            >blog</a
          >
          <a
            href="https://github.com/snowztech"
            target="_blank"
            rel="noopener noreferrer"
            >github</a
          >
        </div>
        <span class="copyright">© <span class="year"></span></span>
      </footer>
    </main>
    <script src="/assets/js/script.js"></script>
  </body>
</html>
