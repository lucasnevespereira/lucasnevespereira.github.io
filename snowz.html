<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="snowz.ai — AI et outils dev en français."
    />
    <title>snowz.ai</title>
    <link rel="canonical" href="https://lucasnp.dev/snowz" />
    <link
      rel="icon"
      type="image/png"
      href="/assets/icons/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
    <link rel="shortcut icon" href="/assets/icons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icons/apple-touch-icon.png"
    />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <style>
      .content li.project {
        padding-left: 0;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .content li.project::before {
        content: none;
      }
      .project-icon {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
      }
      @media (max-width: 480px) {
        .content li.project {
          gap: 0.6rem;
        }
        .project-icon {
          width: 28px;
          height: 28px;
        }
      }
    </style>

    <meta property="og:title" content="snowz.ai" />
    <meta property="og:description" content="AI et outils dev en français." />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://lucasnp.dev/snowz/snowz.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <main>
      <header>
        <img src="/snowz/snowz.png" alt="snowz.ai" class="avatar" />
        <div class="header-actions">
          <button
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Toggle theme"
          >
            <span class="theme-icon">○</span>
          </button>
        </div>
      </header>

      <div class="content">
        <p>
          <strong>snowz.ai</strong> — Open Source Engineer. AI workflows and
          tools.
        </p>

        <ul>
          <li class="project">
            <img src="/snowz/vikusha.png" class="project-icon" alt="" />
            <span
              ><strong
                ><a href="https://github.com/snowztech/vikusha"
                  >vikusha</a
                ></strong
              >
              — framework pour assistants (wip)</span
            >
          </li>
          <li class="project">
            <img src="/snowz/nevinho.png" class="project-icon" alt="" />
            <span
              ><strong
                ><a href="https://github.com/lucasnevespereira/nevinho"
                  >nevinho</a
                ></strong
              >
              — mon assistant perso</span
            >
          </li>
        </ul>
      </div>

      <footer>
        <div class="links">
          <a
            href="https://www.tiktok.com/@snowz.ai"
            target="_blank"
            rel="noopener noreferrer"
            >tiktok</a
          >
          <a
            href="https://www.youtube.com/c/lucaasnp"
            target="_blank"
            rel="noopener noreferrer"
            >youtube</a
          >
          <a
            href="https://dev.to/lucasnevespereira"
            target="_blank"
            rel="noopener noreferrer"
            >blog</a
          >
          <a
            href="https://github.com/snowztech"
            target="_blank"
            rel="noopener noreferrer"
            >github</a
          >
        </div>
        <span class="copyright">© <span class="year"></span></span>
      </footer>
    </main>
    <script src="/assets/js/script.js"></script>
  </body>
</html>
