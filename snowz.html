<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="snowz.ai — AI et outils dev en français."
    />
    <title>snowz.ai</title>
    <link rel="canonical" href="https://lucasnp.dev/snowz" />
    <link
      rel="icon"
      type="image/png"
      href="/assets/icons/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
    <link rel="shortcut icon" href="/assets/icons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icons/apple-touch-icon.png"
    />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        min-height: 100vh;
      }
      main {
        width: 100%;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 13px;
        color: var(--text-muted);
        margin-top: -0.25rem;
        margin-bottom: 1.5rem;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4ade80;
        box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6); }
        70% { box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
        100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
      }
      .section-label {
        font-size: 12px;
        color: var(--text-muted);
        text-transform: lowercase;
        letter-spacing: 0.05em;
        margin: 1.75rem 0 0.75rem;
        opacity: 0.7;
      }
      .content ul {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .content li.project {
        padding: 0.75rem 1rem;
        display: flex;
        align-items: center;
        gap: 0.85rem;
        margin: 0;
        border: 1px solid transparent;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.015);
        transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
      }
      .content li.project:hover {
        border-color: var(--border);
        background: rgba(255, 255, 255, 0.03);
      }
      body:not(.dark) .content li.project {
        background: rgba(0, 0, 0, 0.015);
      }
      body:not(.dark) .content li.project:hover {
        background: rgba(0, 0, 0, 0.03);
      }
      .content li.project::before {
        content: none;
      }
      .project-icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
      }
      .project-meta {
        margin-left: 0.5rem;
        font-size: 11px;
        color: var(--text-muted);
        opacity: 0.7;
        letter-spacing: 0.03em;
      }
      @media (max-width: 480px) {
        body { align-items: flex-start; }
        .content li.project {
          gap: 0.7rem;
          padding: 0.65rem 0.75rem;
        }
        .project-icon {
          width: 32px;
          height: 32px;
        }
      }
    </style>

    <meta property="og:title" content="snowz.ai" />
    <meta property="og:description" content="AI et outils dev en français." />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://lucasnp.dev/snowz/snowz.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <main>
      <header>
        <img src="/snowz/snowz.png" alt="snowz.ai" class="avatar" />
        <div class="header-actions">
          <button
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Toggle theme"
          >
            <span class="theme-icon">○</span>
          </button>
        </div>
      </header>

      <div class="content">
        <p>
          <strong>snowz.ai</strong> — Open Source Engineer. AI workflows and
          tools.
        </p>
        <div class="status">
          <span class="status-dot"></span>
          <span>currently building vikusha</span>
        </div>

        <div class="section-label">// projects</div>
        <ul>
          <li class="project">
            <img src="/snowz/vikusha.png" class="project-icon" alt="" />
            <span
              ><strong
                ><a href="https://github.com/snowztech/vikusha"
                  >vikusha</a
                ></strong
              >
              — framework pour assistants<span class="project-meta">go · wip</span></span
            >
          </li>
          <li class="project">
            <img src="/snowz/nevinho.png" class="project-icon" alt="" />
            <span
              ><strong
                ><a href="https://github.com/lucasnevespereira/nevinho"
                  >nevinho</a
                ></strong
              >
              — mon assistant perso<span class="project-meta">go</span></span
            >
          </li>
        </ul>
      </div>

      <footer>
        <div class="links">
          <a
            href="https://www.tiktok.com/@snowz.ai"
            target="_blank"
            rel="noopener noreferrer"
            >tiktok</a
          >
          <a
            href="https://www.youtube.com/c/lucaasnp"
            target="_blank"
            rel="noopener noreferrer"
            >youtube</a
          >
          <a
            href="https://dev.to/lucasnevespereira"
            target="_blank"
            rel="noopener noreferrer"
            >blog</a
          >
          <a
            href="https://github.com/snowztech"
            target="_blank"
            rel="noopener noreferrer"
            >github</a
          >
        </div>
        <span class="copyright">© <span class="year"></span></span>
      </footer>
    </main>
    <script src="/assets/js/script.js"></script>
  </body>
</html>
