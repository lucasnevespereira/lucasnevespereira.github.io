<!DOCTYPE html>
<html lang="{{.Site.Meta.Lang}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{.Site.Meta.Title}}</title>
  <meta name="description" content="{{.Site.Meta.Description}}" />
  <meta name="author" content="{{.Site.Name}}" />
  <link rel="canonical" href="{{.Site.Meta.SiteUrl}}/" />

  <link rel="icon" type="image/png" href="/assets/icons/favicon.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <link rel="shortcut icon" href="/assets/icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/icons/site.webmanifest" />

  <script>
    try {
      var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@snowztech/ui-css@0.7.0/dist/tokens.css" />
  <link rel="stylesheet" href="/themes/minimal/styles.css?v=7" />

  <meta property="og:type" content="profile" />
  <meta property="og:url" content="{{.Site.Meta.SiteUrl}}/" />
  <meta property="og:site_name" content="{{.Site.Name}}" />
  <meta property="og:title" content="{{.Site.Meta.Title}}" />
  <meta property="og:description" content="{{.Site.Meta.Description}}" />
  <meta property="og:image" content="{{.Site.Meta.SiteUrl}}{{.Site.Avatar}}" />
  <meta property="og:image:alt" content="{{.Site.Name}}" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{.Site.Meta.Title}}" />
  <meta name="twitter:description" content="{{.Site.Meta.Description}}" />
  <meta name="twitter:image" content="{{.Site.Meta.SiteUrl}}{{.Site.Avatar}}" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": {{.Site.Name}},
    "url": {{.Site.Meta.SiteUrl}},
    "image": "{{.Site.Meta.SiteUrl}}{{.Site.Avatar}}",
    "jobTitle": "Software Engineer",
    "address": { "@type": "PostalAddress", "addressLocality": "Paris", "addressCountry": "FR" },
    "sameAs": [{{range $i, $l := .Site.Contact.Socials}}{{if $i}}, {{end}}{{$l.URL}}{{end}}]
  }
  </script>
</head>
<body>
  <main>
    <header>
      {{if .Site.Avatar}}
      <img src="{{.Site.Avatar}}" alt="{{.Site.Name}}" class="avatar" />
      {{end}}
      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <span class="theme-icon">○</span>
        </button>
      </div>
    </header>

    <div class="content">{{.Content}}</div>

    <footer>
      <div class="links">
        {{if .Site.Contact.Socials}}
        {{range .Site.Contact.Socials}}
        <a href="{{.URL}}" target="_blank" rel="noopener noreferrer">{{.Name}}</a>
        {{end}}
        {{else if .Site.Links}}
        {{range .Site.Links}}
        <a href="{{.URL}}" target="_blank" rel="noopener noreferrer">{{.Name}}</a>
        {{end}}
        {{end}}
      </div>
      <span class="copyright">built with <a href="https://github.com/snowztech/inkssg" target="_blank" rel="noopener noreferrer">ink</a> · © <span class="year"></span></span>
    </footer>
  </main>
  <script src="/themes/minimal/script.js?v=6"></script>
</body>
</html>
